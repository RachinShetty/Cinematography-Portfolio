name: Build video thumbnails and previews

on:
  push:
    paths:
      - "media/ids.txt"
      - "tools/media.py"
      - ".github/workflows/media.yml"
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * *"   # daily retry for any clips Drive refused (03:10 IST)

permissions:
  contents: write

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet gdown
      - name: Build media
        run: python3 tools/media.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets media/report.txt
          git commit -m "Add HD video previews" || exit 0
          git pull --rebase
          git push
